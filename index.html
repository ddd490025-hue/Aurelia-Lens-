<meta name="theme-color" content="#f6e7e9"><title>Aurelia Lens — Creative Studio</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3f1;--paper:#fffaf8;--pink:#e8759a;--pink2:#f5dce1;--ink:#332d2c;--muted:#8c7774;--line:#eadbd7;--shadow:0 22px 55px rgba(100,55,55,.11)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px "DM Sans",sans-serif}button,input,textarea,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}a{color:inherit}.shell{width:min(1180px,calc(100% - 40px));margin:auto}.nav-wrap{position:sticky;top:0;z-index:20;background:rgba(251,243,241,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px}.brand-mark{width:27px;height:27px;border:1px solid #caa8a5;border-radius:8px;display:grid;place-items:center}.brand-mark svg{width:16px}.nav-links{display:flex;gap:28px}.nav-links button,.footer button{font-size:11px;color:var(--muted)}.nav-links button:hover,.footer button:hover,.text-link{color:var(--pink)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:999px;padding:11px 19px;font-size:10px;transition:.25s;white-space:nowrap}.btn svg{width:13px}.btn-primary{background:var(--pink);color:#fff;box-shadow:0 8px 20px rgba(232,117,154,.2)}.btn-ghost{border:1px solid var(--line);background:#fff8f6}.btn:hover{transform:translateY(-2px)}.menu-toggle{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;place-items:center}.menu-toggle svg{width:18px}.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:50px;align-items:center;padding:75px 0 65px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#9d777d}.hero h1,.page h1,.auth h1,.reset h1{font:500 clamp(42px,5.2vw,70px)/1.02 "Playfair Display",serif;margin:18px 0}.hero h1 em,.page h1 em,.auth h1 em,.reset h1 em,.cta h2 em{color:var(--pink)}.hero p,.section-title p,.page>p,.about-copy p,.service-card p,.detail-copy p,.contact-side p{color:var(--muted);line-height:1.75;font-size:12px;max-width:600px}.hero-actions{display:flex;gap:10px;margin:25px 0}.hero-note{font-size:10px;color:var(--muted);display:flex;gap:8px;align-items:center}.hero-note:first-letter{color:var(--pink)}.hero-art{height:520px;position:relative}.hero-frame{position:absolute;background:white;padding:10px;box-shadow:var(--shadow)}.hero-frame img{width:100%;height:100%;object-fit:cover}.hero-frame.main{width:66%;height:78%;right:5%;top:6%;transform:rotate(3deg)}.hero-frame.polaroid{width:39%;height:42%;left:4%;bottom:7%;transform:rotate(-8deg)}.botanical{position:absolute;right:0;top:0;color:#a88786;font-size:60px;line-height:.7}.hero-heart{position:absolute;right:10%;bottom:0;color:var(--pink);font-size:42px}.section{padding:85px 0}.section-title{margin-bottom:35px}.section-title.center{text-align:center}.section-title h2,.cta h2{font:500 42px/1.08 "Playfair Display",serif;margin:9px 0 10px}.section-title.center p{margin:auto}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.service-card,.service-mini,.project-card,.price-card{border:1px solid var(--line);background:var(--paper);border-radius:18px;text-align:left;transition:.25s}.service-card:hover,.service-mini:hover,.project-card:hover,.price-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.service-card{padding:25px;min-height:230px}.service-icon{width:40px;height:40px;border-radius:50%;background:var(--pink2);display:grid;place-items:center;color:var(--pink);font-size:18px}.service-card h3{font:500 22px "Playfair Display",serif;margin:18px 0 8px}.mini{grid-template-columns:repeat(6,1fr)}.service-mini{padding:18px;min-height:175px;display:grid;align-content:start;gap:8px}.service-mini strong{font-size:12px}.service-mini span:last-child{font-size:10px;line-height:1.55;color:var(--muted)}.split{display:flex;align-items:end;justify-content:space-between;gap:20px}.projects{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.project-card{overflow:hidden;padding:0}.photo{position:relative;overflow:hidden}.photo img{width:100%;aspect-ratio:1/.92;display:block;object-fit:cover;transition:.5s}.project-card:hover img{transform:scale(1.04)}.photo-spark{position:absolute;right:10px;top:10px;color:white;text-shadow:0 1px 4px #444}.project-meta{padding:14px}.project-meta span,.project-meta small{display:block;font-size:9px;color:var(--muted)}.project-meta strong{display:block;font:500 17px "Playfair Display",serif;margin:5px 0}.project-meta small{display:flex;align-items:center;gap:5px;color:var(--pink)}.quote-band{background:#f4e2e4;padding:55px 0}.quote{text-align:center;position:relative}.quote p{font:500 29px/1.3 "Playfair Display",serif}.quote p em{color:var(--pink)}.signature{font-size:10px;color:var(--muted)}.quote-flower{font-size:35px;color:#a88687}.cta{margin:65px auto;background:#f5e1e3;border-radius:24px;padding:42px;display:flex;align-items:center;justify-content:space-between;gap:25px}.cta h2{margin:7px 0 0}.footer{border-top:1px solid var(--line);padding:55px 0 25px}.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}.footer-grid>div{display:grid;align-content:start;gap:9px}.footer p,.footer span,.footer a{font-size:10px;color:var(--muted);line-height:1.6}.footer strong{font-size:10px}.footer-bottom{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:35px;padding-top:18px}.page{padding:65px 0 90px}.page-head{max-width:760px;margin-bottom:45px}.about-grid,.detail-grid,.contact-grid,.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.about-photo img{aspect-ratio:1/.85}.values{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}.value{border-top:1px solid var(--line);padding-top:16px}.value b{color:var(--pink);font-size:20px}.value strong{display:block;font:500 18px "Playfair Display",serif;margin:7px 0}.value span{font-size:10px;color:var(--muted)}.process{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:35px 0 60px}.process>div{border-top:1px solid var(--line);padding-top:14px}.process b{color:var(--pink);font-size:11px}.process h3{font:500 20px "Playfair Display",serif;margin:8px 0}.process p{font-size:10px;color:var(--muted);line-height:1.6}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.filters button{border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:10px}.filters button.active{background:var(--pink);border-color:var(--pink);color:white}.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.detail-grid{align-items:start}.detail-grid .photo img{aspect-ratio:1/.8}.project-info{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-block:1px solid var(--line);padding:20px 0;margin:40px 0}.project-info span,.contact-side span{font-size:9px;color:var(--muted);text-transform:uppercase}.project-info strong{font-size:12px}.case-grid{align-items:start}.case-grid>div{border-top:1px solid var(--line);padding-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:#fff8f6;border-radius:18px;padding:25px;margin-top:30px}.stats div{text-align:center}.stats b{display:block;font:500 30px "Playfair Display",serif;color:var(--pink)}.stats span{font-size:9px;color:var(--muted)}.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.price-card{padding:28px;min-height:350px;display:flex;flex-direction:column}.price-card>span{font-size:10px;color:var(--muted)}.price-card h3{font:500 28px "Playfair Display",serif;margin:10px 0}.price-card p{font-size:10px;color:var(--muted);line-height:1.7}.price-card .btn{margin-top:auto}.featured{border-color:#e4a1b5}.contact-grid{align-items:start}.form{background:#fff9f7;border:1px solid var(--line);border-radius:20px;padding:28px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form label,.auth label{display:grid;gap:6px;font-size:10px;color:#8d7777;margin-bottom:15px}.form input,.form textarea,.form select,.auth input{width:100%;border:1px solid #e3d2ce;background:#fffdfc;border-radius:10px;padding:12px;outline:none}.form textarea{min-height:120px;resize:vertical}.contact-side{display:grid;gap:30px;padding:10px}.contact-side div{display:grid;gap:5px}.contact-side a{font:500 20px "Playfair Display",serif}.auth{min-height:calc(100vh - 72px);display:grid;grid-template-columns:1fr 1fr}.auth-art{background:#f2dfe0;display:grid;place-items:center;position:relative}.auth-art img{width:65%;height:75%;object-fit:cover;transform:rotate(-4deg);box-shadow:var(--shadow);border:8px solid white}.auth-panel{display:grid;place-items:center;padding:60px 35px}.auth-inner{width:min(430px,100%)}.auth h1{font-size:48px;margin:10px 0}.auth-inner>p{font-size:11px;color:var(--muted)}.auth-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.password{position:relative}.password button{position:absolute;right:7px;top:7px;width:34px;height:34px}.text-link{text-decoration:underline;font-size:10px}.small-note{text-align:center;font-size:10px;color:var(--muted)}.reset{min-height:70vh;display:grid;place-items:center;text-align:center}.reset-card{max-width:560px;background:#fff9f7;border:1px solid var(--line);border-radius:24px;padding:55px 30px;box-shadow:var(--shadow)}.reset-icon{width:68px;height:68px;border-radius:50%;background:var(--pink2);display:grid;place-items:center;margin:0 auto 18px;color:var(--pink)}.reset-card p{font-size:11px;color:var(--muted);line-height:1.7}.success{text-align:center;padding:60px 20px}.success-icon{width:65px;height:65px;border-radius:50%;background:var(--pink2);color:var(--pink);display:grid;place-items:center;margin:auto}.drawer{position:fixed;inset:0;background:rgba(51,45,44,.25);z-index:50;display:flex;justify-content:flex-end}.drawer-card{width:min(390px,88%);height:100%;background:#fff9f7;padding:25px;box-shadow:-20px 0 60px rgba(70,40,40,.12);animation:slide .25s ease}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-links{display:grid;gap:22px;margin:55px 0}.drawer-links button{font:500 28px "Playfair Display",serif;text-align:left}.drawer-links button:hover{color:var(--pink)}.mobile-page{min-height:70vh;display:grid;place-items:center;padding:45px}.mobile-card{width:min(390px,100%);background:#fff9f7;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.mobile-card .drawer-links{margin:35px 0}.hide{display:none!important}@keyframes slide{from{transform:translateX(100%)}to{transform:none}}@media(max-width:900px){.nav-links,.nav>.btn{display:none}.menu-toggle{display:grid}.hero{grid-template-columns:1fr}.hero-art{height:420px}.mini{grid-template-columns:repeat(3,1fr)}.projects{grid-template-columns:repeat(2,1fr)}.footer-grid{grid-template-columns:repeat(2,1fr)}.about-grid,.detail-grid,.contact-grid,.case-grid{grid-template-columns:1fr}.values,.process{grid-template-columns:repeat(2,1fr)}.pricing{grid-template-columns:1fr 1fr}.auth{grid-template-columns:1fr}.auth-art{display:none}}@media(max-width:560px){.shell{width:min(100% - 28px,1180px)}.hero{padding-top:50px}.hero h1{font-size:42px}.hero-art{height:330px}.mini,.projects,.portfolio-grid,.pricing,.values,.process{grid-template-columns:1fr}.section-title h2,.cta h2{font-size:34px}.split,.cta{align-items:flex-start;flex-direction:column}.cta{padding:28px}.footer-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.project-info,.stats{grid-template-columns:1fr}.auth-panel{padding:50px 18px}.auth h1{font-size:40px}.page{padding-top:50px}}
</style>
</head>
<body><div id="app"></div><script>
const P={camera:"https://images.unsplash.com/photo-1452780212940-6f5c0d14d848?auto=format&fit=crop&w=1000&q=82",portrait:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1000&q=82",editorial:"https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?auto=format&fit=crop&w=1000&q=82",flower:"https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=82",fashion:"https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=1000&q=82",desk:"https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1000&q=82"};
const services=[["UI/UX Design","✦"],["Brand Identity","♡"],["Visual & Graphic Design","◌"],["Photography","◉"],["Social Media Design","⌁"],["Website Design","▣"]];
const projects=[["Aesthetic Brand Identity","Branding",P.flower],["Product Photography","Photography",P.camera],["Social Media Campaign","Social Media",P.fashion],["Website Design","UI/UX",P.editorial],["Editorial Portraits","Photography",P.portrait],["Mobile App UI","UI/UX",P.desk]];
const nav=[["Home","/"],["About Us","/about"],["Services","/services"],["Portfolio","/portfolio"],["Contact","/contact"]];
const I=n=>({arrow:"→",close:"×",menu:"☰",eye:"◉",mail:"✉",check:"✓"}[n]||"");
const go=p=>{location.hash="#"+p;scrollTo(0,0)};
const btn=(t,p="/",c="primary")=>'<button class="btn btn-'+c+'" data-go="'+p+'">'+t+" "+I("arrow")+"</button>";
const brand=()=>'<button class="brand" data-go="/"><span class="brand-mark">◉</span>Aurelia Lens</button>';
const navBar=()=>'<header class="nav-wrap"><nav class="nav shell">'+brand()+'<div class="nav-links">'+nav.map(x=>'<button data-go="'+x[1]+'">'+x[0]+"</button>").join("")+"</div>"+btn("Start a Project","/contact")+'<button class="menu-toggle" data-go="/mobile-menu">☰</button></nav></header>';
const foot=()=>'<footer class="footer"><div class="shell footer-grid"><div>'+brand()+"<p>Small studio. Big dreams.<br>Thoughtful design, beautiful imagery and warm storytelling.</p></div><div><strong>Explore</strong>"+nav.map(x=>'<button data-go="'+x[1]+'">'+x[0]+"</button>").join("")+'</div><div><strong>Services</strong>'+services.map(x=>'<button data-go="/services">'+x[1]+" "+x[0]+"</button>").join("")+'</div><div><strong>Say hello</strong><a href="mailto:hello@aureliastudio.com">hello@aureliastudio.com</a><span>Manila · Remote</span></div></div><div class="shell footer-bottom"><span>© 2026 Aurelia Lens Studio</span><span>Made with care & petals ✿</span></div></footer>';
const shell=x=>navBar()+x+foot();
const title=(e,h,p)=>'<div class="page-head"><span class="eyebrow">'+e+" ♡</span><h1>"+h+"</h1><p>"+p+"</p></div>";
const card=p=>'<button class="project-card" data-go="/project"><div class="photo"><img src="'+p[2]+'" alt="'+p[0]+'" loading="lazy"><span class="photo-spark">✦</span></div><div class="project-meta"><span>'+p[1]+'</span><strong>'+p[0]+'</strong><small>View project →</small></div></button>';
function home(){return shell('<main><section class="hero shell"><div><span class="eyebrow">Creative studio · Manila & beyond ♡</span><h1>Capture Moments.<br><em>Create Experiences.</em><br>Build Identities.</h1><p>We help thoughtful businesses and curious creatives bring their stories to life through refined design, beautiful visuals and an unmistakably human point of view.</p><div class="hero-actions">'+btn("Explore Our Work","/portfolio")+btn("Start a Project","/contact","ghost")+'</div><div class="hero-note">✿ Thoughtful design for brands with a story to tell.</div></div><div class="hero-art"><div class="hero-frame main"><img src="'+P.portrait+'" alt="Creative portrait"></div><div class="hero-frame polaroid"><img src="'+P.camera+'" alt="Camera"></div><div class="botanical">✿</div><div class="hero-heart">♡</div></div></section><section class="shell section"><div class="section-title center"><span class="eyebrow">What We Create ♡</span><h2>A little beauty, a lot of intention.</h2><p>From first sketch to final frame, we create visual experiences that feel considered, warm and distinctly yours.</p></div><div class="service-grid mini">'+services.map(s=>'<button class="service-mini" data-go="/services"><span class="service-icon">'+s[1]+'</span><strong>'+s[0]+'</strong><span>Thoughtful creative direction with a soft signature.</span></button>').join("")+'</div></section><section class="shell section"><div class="split"><div class="section-title"><span class="eyebrow">Selected Works ♡</span><h2>Made with feeling.</h2><p>A few recent stories we’ve helped shape.</p></div>'+btn("View All Projects","/portfolio","ghost")+'</div><div class="projects">'+projects.slice(0,4).map(card).join("")+'</div></section><section class="quote-band"><div class="shell quote"><span class="quote-flower">✿</span><p>“Great design isn’t just about what it looks like.<br><em>It’s about how it makes you feel.</em>”</p><span class="signature">— Aurelia Lens</span></div></section><section class="shell cta"><div><span class="eyebrow">Have something lovely in mind? ♡</span><h2>Let’s create something<br><em>beautiful together.</em></h2></div>'+btn("Let’s Talk","/contact")+'</section></main>')}
function auth(type){let s=type==="signup",f=type==="forgot";return navBar()+('<main class="auth"><div class="auth-art"><img src="'+P.editorial+'" alt="Editorial studio"></div><div class="auth-panel"><div class="auth-inner"><span class="eyebrow">Aurelia Lens ♡</span><h1>'+ (s?"Create your Account":f?"Forgot Password?":"Welcome Back")+'</h1><p>'+(s?"Build a beautiful brand, one thoughtful detail at a time.":f?"Enter your email address and we’ll send you a reset link.":"Sign in to continue your creative journey.")+'</p><form onsubmit="authSubmit(event,''+(f?"forgot":s?"signup":"signin")+'')">'+(s?'<label>Full name<input required placeholder="Your full name"></label>':"")+'<label>Email address<input required type="email" placeholder="you@example.com"></label>'+(f?"":'<label>Password<div class="password"><input required id="pw" type="password" placeholder="Enter your password"><button type="button" onclick="togglePw()">◉</button></div></label>')+(s?'<label>Confirm password<input required type="password" placeholder="Confirm your password"></label>':"")+(f?"":'<div class="auth-row"><span style="font-size:10px;color:var(--muted)">♡ Remember me</span><button type="button" class="text-link" data-go="/forgot">Forgot password?</button></div>')+btn(s?"Create Account":f?"Send Reset Link":"Sign In",f?"/reset":"/","primary")+'</form><p class="small-note">'+(s?'Already have an account? ':f?'':'Don’t have an account? ')+'<button class="text-link" data-go="'+(s?"/signin":"/signup")+'">'+(s?"Sign in":"Create one")+"</button></p></div></div></main>")+foot()}
function about(){return shell('<main class="shell page">'+title("About Us","Small studio. Big dreams.","Aurelia Lens is a creative studio built around thoughtful storytelling, beautiful details and the belief that good design should feel like you.")+'<div class="about-grid"><div class="photo about-photo"><img src="'+P.editorial+'" alt="Studio portrait"></div><div class="about-copy"><h2>Our Story</h2><p>It started with a little camera, a notebook full of ideas and a love for making things feel special. Today we help founders and teams shape identities, images and digital experiences that are warm, clear and memorable.</p><p>We believe the best work balances beauty with purpose: every detail should have a reason to be there.</p>'+btn("Let’s Create Something","/contact")+'</div></div><div class="section-title" style="margin-top:80px"><span class="eyebrow">Our Values ♡</span><h2>Good work, gently made.</h2></div><div class="values">'+["Creativity","Quality","Collaboration","Kindness"].map((x,i)=>'<div class="value"><b>0'+(i+1)+'</b><strong>'+x+'</strong><span>Curious, considered and human.</span></div>').join("")+'</div></main>')}
function servicesPage(){return shell('<main class="shell page">'+title("Services","Our Services ♡","Creative solutions for brands, businesses and personal projects.")+'<div class="service-grid">'+services.map(s=>'<article class="service-card"><span class="service-icon">'+s[1]+'</span><h3>'+s[0]+'</h3><p>Strategy, visual direction and polished execution shaped around your story, audience and goals.</p>'+btn("Learn More","/service","ghost")+'</article>').join("")+'</div><div class="cta">'+btn("Start a Project","/contact")+'<span class="eyebrow">Need something custom? Tell us what you’re dreaming up. ♡</span></div></main>')}
function detail(){return shell('<main class="shell page">'+title("Service Detail","UI/UX Design ♡","Intuitive. Functional. Beautiful. We design digital experiences that feel effortless and unmistakably yours.")+'<div class="detail-grid"><div><div class="photo"><img src="'+P.desk+'" alt="UI UX desk"></div></div><div><h2>Design that makes sense and feels lovely.</h2><p>We combine research, structure and visual craft to create interfaces people can understand quickly and enjoy using.</p><div class="process">'+["Research","Direction","Design","Testing"].map((x,i)=>'<div><b>0'+(i+1)+'</b><h3>'+x+'</h3><p>Clear decisions, thoughtful details and useful outcomes.</p></div>').join("")+'</div>'+btn("Book a Project","/contact")+'</div></div></main>')}
function portfolio(){return shell('<main class="shell page"><div class="page-head"><span class="eyebrow">Our Portfolio ♡</span><h1>Selected work.</h1><p>A collection of brand, photography, social and digital projects.</p></div><div class="filters" id="filters">'+["All","Branding","Photography","Social Media","UI/UX"].map((x,i)=>'<button class="'+(!i?"active":"")+'" onclick="filterWork(''+x+'',this)">'+x+"</button>").join("")+'</div><div class="portfolio-grid" id="portfolio-grid">'+projects.map(card).join("")+'</div></main>')}
function project(){return shell('<main class="shell page">'+title("Project Detail","Aesthetic Brand Identity ♡","A romantic identity system designed to make a modern lifestyle brand feel tactile, personal and memorable.")+'<div class="detail-grid"><div class="photo"><img src="'+P.flower+'" alt="Brand identity"></div><div><h2>Soft structure, strong personality.</h2><p>We created a cohesive identity across logo direction, typography, color, packaging and campaign imagery.</p><div class="project-info"><div><span>Client</span><strong>Maison Flora</strong></div><div><span>Scope</span><strong>Brand Identity</strong></div><div><span>Year</span><strong>2026</strong></div></div>'+btn("View Case Study","/case")+'</div></div></main>')}
function caseStudy(){return shell('<main class="shell page">'+title("Case Study","Building a softer kind of confidence.","How a focused identity system helped a lifestyle brand show up consistently across every touchpoint.")+'<div class="photo"><img src="'+P.flower+'" alt="Case study banner"></div><div class="case-grid" style="margin-top:55px"><div><h2>The Challenge</h2><p>Translate an intimate, tactile brand story into a flexible visual language that could scale from packaging to digital.</p></div><div><h2>The Results</h2><p>A cohesive identity system with clearer hierarchy, stronger recognition and a toolkit the team could use confidently.</p></div></div><div class="stats"><div><b>+40%</b><span>Engagement</span></div><div><b>+32%</b><span>Save Rate</span></div><div><b>+28%</b><span>Sales Growth</span></div></div></main>')}
function pricing(){return shell('<main class="shell page">'+title("Pricing","Simple & transparent pricing.","Choose a starting point, then we tailor the scope around your needs.")+'<div class="pricing">'+[["Starter","$50+","For focused design support."],["Standard","$150+","For a complete creative package."],["Premium","$300+","For a deeper brand or digital engagement."]].map((x,i)=>'<article class="price-card '+(i===1?"featured":"")+'"><span>'+x[0]+'</span><h3>'+x[1]+'</h3><p>'+x[2]+'</p><p>✓ Clear creative direction</p><p>✓ Thoughtful visual system</p><p>✓ Revisions & delivery support</p>'+btn("Get Started","/contact")+'</article>').join("")+'</div><div class="cta"><div><span class="eyebrow">Need something custom? ♡</span><h2>Let’s build the right package.</h2></div>'+btn("Contact Us","/contact")+'</div></main>')}
function contact(){return shell('<main class="shell page"><div class="contact-grid"><div><span class="eyebrow">Start a conversation ♡</span><h1>Tell us what you’re dreaming up.</h1><p>Share a little about your project, timeline and what success looks like. We’ll get back to you with thoughtful next steps.</p><div class="contact-side"><div><span>Email</span><a href="mailto:hello@aureliastudio.com">hello@aureliastudio.com</a></div><div><span>Based in</span><p>Manila · working worldwide</p></div></div></div><form class="form" onsubmit="contactSubmit(event)"><div class="form-row"><label>Name<input required placeholder="Your name"></label><label>Email<input required type="email" placeholder="you@example.com"></label></div><label>Project type<select><option>Brand Identity</option><option>Photography</option><option>UI/UX Design</option><option>Website Design</option><option>Social Media Design</option></select></label><label>Tell us about it<textarea required placeholder="A few words about your project..."></textarea></label><button class="btn btn-primary" type="submit">Send Message →</button></form></div></main>')}
function mobile(){return '<main class="mobile-page"><div class="mobile-card">'+brand()+'<div class="drawer-links">'+nav.map(x=>'<button data-go="'+x[1]+'">'+x[0]+'</button>').join("")+'</div>'+btn("Start a Project","/contact")+'</div></main>'}
function render(){let r=(location.hash||"#/").slice(1).split("?")[0]||"/";let v=r==="/" ? home():r==="/signin"?auth("signin"):r==="/signup"?auth("signup"):r==="/forgot"?auth("forgot"):r==="/reset"?'<main class="reset shell"><div class="reset-card"><div class="reset-icon">✉</div><span class="eyebrow">Aurelia Lens ♡</span><h1>Check your email</h1><p>We’ve sent a password reset link to your email address. It should arrive shortly.</p>'+btn("Back to Sign In","/signin")+'</div></main>':r==="/about"?about():r==="/services"?servicesPage():r==="/service"?detail():r==="/portfolio"?portfolio():r==="/project"?project():r==="/case"?caseStudy():r==="/pricing"?pricing():r==="/contact"?contact():r==="/mobile-menu"?mobile():'<main class="shell page" style="text-align:center"><h1>Page not found.</h1>'+btn("Back Home","/")+'</main>';document.getElementById("app").innerHTML=v;wire()}
function wire(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
function togglePw(){const x=document.getElementById("pw");if(x)x.type=x.type==="password"?"text":"password"}
function authSubmit(e,t){e.preventDefault();if(t==="forgot")go("/reset");else go("/")}
function contactSubmit(e){e.preventDefault();e.target.innerHTML='<div class="success"><div class="success-icon">✓</div><h2>Message received.</h2><p>Thank you for reaching out. We’ll be in touch soon.</p>'+btn("Back Home","/")+'</div>';wire()}
function filterWork(cat,el){document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("active"));el.classList.add("active");let data=cat==="All"?projects:projects.filter(x=>x[1]===cat);document.getElementById("portfolio-grid").innerHTML=data.map(card).join("");wire()}
addEventListener("hashchange",render);render();
</script></body></html>
